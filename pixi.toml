[workspace]
name = "ihw-py"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.13.*"
numpy = ">=1.23"
scipy = ">=1.11"
pandas = ">=1.5"
matplotlib = ">=3.6"
marimo = ">=0.23.14,<1"
pytest = "*"
ruff = "*"

[pypi-dependencies]
ihw-py = { path = ".", editable = true }

[tasks]
test = "pytest -q"
lint = "ruff check ."
notebook = "marimo edit examples/ihw_toy_example.py"

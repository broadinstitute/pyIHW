[project]
site_name = "pyIHW"
site_description = "Independent Hypothesis Weighting in Python"
site_url = "https://broadinstitute.github.io/pyIHW/"
repo_url = "https://github.com/broadinstitute/pyIHW"
repo_name = "broadinstitute/pyIHW"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Interactive notebook" = "notebook.md" },
  { "pysceptre workflow" = "pysceptre.md" },
  { "QC plots" = "qc.md" },
  { "API reference" = "api.md" },
]

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
variant = "modern"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
pymdownx.arithmatex.generic = true
pymdownx.highlight = {}
pymdownx.superfences = {}

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = false
docstring_style = "google"

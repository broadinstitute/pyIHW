[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyihw"
version = "0.1.0"
description = "Independent hypothesis weighting for multiple testing"
readme = "README.md"
requires-python = ">=3.9"
license = "Artistic-2.0"
authors = [
  { name = "pyIHW contributors" },
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
notebook = ["marimo", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
